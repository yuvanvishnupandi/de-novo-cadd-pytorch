name: EUREKA Discovery Pipeline Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build In-Silico Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Backend Integrity
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -c "
          from backend.biophysics_forcefield import BiophysicalGridBox, LamarckianGeneticAlgorithm
          from backend.admet_pharmacokinetics import ADMETPredictor
          from backend.crispr_locus_engine import LocusSimulator
          print('EUREKA In-Silico Architecture & Force-Fields Verified')
          "

