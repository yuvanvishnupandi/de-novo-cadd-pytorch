    <text x="75" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">PyTorch LSTM</text>
    <line x1="20" y1="112" x2="130" y2="112" stroke="#334155" stroke-dasharray="2,2" />
    <text x="75" y="132" font-family="monospace" font-size="9" fill="#60a5fa" text-anchor="middle">SMILES Sampling</text>
    <text x="75" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Temperature T = 0.8</text>
    <text x="75" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Syntactic Validation</text>
    <rect x="25" y="180" width="100" height="12" rx="6" fill="#1e3a8a" fill-opacity="0.3" />
    <text x="75" y="189" font-family="monospace" font-size="7.5" fill="#60a5fa" text-anchor="middle">NOVEL LIGANDS</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 368 195 L 392 195" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  <polygon points="392,191 400,195 392,199" fill="#3b82f6" />

