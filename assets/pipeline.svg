  <g transform="translate(400, 95)">
    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#greenGrad)" />
    <circle cx="75" cy="40" r="18" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
