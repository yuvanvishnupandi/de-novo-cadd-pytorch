    <text x="75" y="189" font-family="monospace" font-size="7.5" fill="#2dd4bf" text-anchor="middle">FORCE FIELDS</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 738 195 L 762 195" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
  <polygon points="762,191 770,195 762,199" fill="#14b8a6" />

  <!-- Step 5: MPO & Potency Derivation -->
  <g transform="translate(770, 95)">
    <rect width="145" height="200" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="145" height="4" rx="2" fill="url(#purpleGrad)" />
    <circle cx="72" cy="40" r="18" fill="#6d28d9" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="72" y="45" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">05</text>
    <text x="72" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Potency &amp; MPO</text>
    <text x="72" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">van 't Hoff &amp; Desirability</text>
    <line x1="20" y1="112" x2="125" y2="112" stroke="#334155" stroke-dasharray="2,2" />
    <text x="72" y="132" font-family="monospace" font-size="9" fill="#a78bfa" text-anchor="middle">Ki = exp(ΔG / RT)</text>
    <text x="72" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">D = Π(d_i)^(1/6)</text>
    <text x="72" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Accounting Integrity</text>
    <rect x="22" y="180" width="100" height="12" rx="6" fill="#4c1d95" fill-opacity="0.3" />
    <text x="72" y="189" font-family="monospace" font-size="7.5" fill="#a78bfa" text-anchor="middle">HARRI-DERRINGER</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 918 195 L 940 195" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <polygon points="940,191 948,195 940,199" fill="#8b5cf6" />

  <!-- Step 6: 3D Visualization Studio -->
  <g transform="translate(948, 95)">
    <rect width="125" height="200" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="125" height="4" rx="2" fill="url(#purpleGrad)" />
    <circle cx="62" cy="40" r="18" fill="#be185d" fill-opacity="0.3" stroke="#ec4899" stroke-width="1.5" />
    <text x="62" y="45" font-family="monospace" font-size="14" fill="#f472b6" text-anchor="middle" font-weight="bold">06</text>
    <text x="62" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">3D Studio</text>
    <text x="62" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">3Dmol.js WebGL</text>
    <line x1="15" y1="112" x2="110" y2="112" stroke="#334155" stroke-dasharray="2,2" />
    <text x="62" y="132" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">Pose Inspection</text>
    <text x="62" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Bioisostere Scan</text>
    <text x="62" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">H-Bond Dyads</text>
    <rect x="18" y="180" width="90" height="12" rx="6" fill="#831843" fill-opacity="0.3" />
    <text x="62" y="189" font-family="monospace" font-size="7.5" fill="#f472b6" text-anchor="middle">INTERACTIVE</text>
  </g>

  <!-- Bottom Tagline -->
  <text x="550" y="325" font-family="monospace" font-size="10.5" fill="#64748b" text-anchor="middle">PyTorch · AutoDock Vina v1.2.7 · RDKit · ESMFold · 3Dmol.js · React 19</text>
</svg>
