    <text x="75" y="132" font-family="monospace" font-size="9" fill="#2dd4bf" text-anchor="middle">Monte Carlo LGA</text>
    <text x="75" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">BFGS Minimization</text>
    <text x="75" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">ΔG Affinity Scoring</text>
