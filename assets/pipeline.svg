  <g transform="translate(215, 95)">
    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#cyanGrad)" />
    <circle cx="75" cy="40" r="18" fill="#1d4ed8" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1.5" />
