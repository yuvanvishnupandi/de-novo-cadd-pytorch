    <text x="75" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Cheminformatics</text>
    <text x="75" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">RDKit WASM Filters</text>
    <line x1="20" y1="112" x2="130" y2="112" stroke="#334155" stroke-dasharray="2,2" />
    <text x="75" y="132" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">Lipinski Rule-of-5</text>
    <text x="75" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">PAINS / Brenk Alerts</text>
    <text x="75" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">TPSA &amp; QED Screening</text>
