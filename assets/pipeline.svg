<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="360" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title -->
  <text x="550" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">DE NOVO COMPUTATIONAL BIOPHYSICS &amp; CADD PIPELINE</text>
  <text x="550" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Deterministic In-Silico Molecular Generation, Filtering, Thermodynamic Docking &amp; 3D Biophysics</text>

  <!-- Step 1: Target Ingestion -->
  <g transform="translate(30, 95)">
    <rect width="150" height="200" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#cyanGrad)" />
    <circle cx="75" cy="40" r="18" fill="#0e7490" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1.5" />
    <text x="75" y="45" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="bold">01</text>
    <text x="75" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">Target Receptor</text>
    <text x="75" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">PDB / FASTA Ingest</text>
    <line x1="20" y1="112" x2="130" y2="112" stroke="#334155" stroke-dasharray="2,2" />
    <text x="75" y="132" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">ESMFold pLDDT &gt; 80</text>
    <text x="75" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Cavity Centroid [x,y,z]</text>
    <text x="75" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">PDBQT Atom Typing</text>
    <rect x="25" y="180" width="100" height="12" rx="6" fill="#0369a1" fill-opacity="0.3" />
    <text x="75" y="189" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">CRYSTAL BOUNDS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 183 195 L 207 195" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <polygon points="207,191 215,195 207,199" fill="#38bdf8" />

